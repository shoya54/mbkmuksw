<!DOCTYPE html>
<html>
  <head>
    <base href="/mbkmuksw/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth | MBKM-UKSW</title>
    <link rel="icon" href="assets/images/dakproject.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js'></script>
    <style>
      body { margin-top: 20px; background: #f6f9fc; }
      .bg-login { padding: 0; background-image: url(https://cdn.jsdelivr.net/gh/hoshoshos/appscript@main/UKSW.bgmakara.png); background-size: cover; height: 100%; position: relative; }
      .bg-login .overlay { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; position: absolute; top: 0; bottom: 0; left: 0; right: 0; background-color: rgba(0, 0, 0, 0.4); }
      .bg-login .account-testimonial { text-align: center; color: #fff; position: absolute; margin: 0 auto; padding: 0 1.75rem; bottom: 3rem; left: 0; right: 0; }
      input#inputPwd {padding-right:40px;}
      i#togglePwd { float: right; margin-left: -25px; margin-top: -30px; right: 10px; position: relative; z-index: 2; cursor: pointer;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  </head>
  <body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 380px;">
        <div class="d-flex align-items-center justify-content-center gap-3 pb-3 mb-3 border-bottom">
          <img src="assets/images/dakproject.png" alt="Logo DAKProject" width="72" class="rounded">
          <div class="lh-sm">
            <h5 class="fw-bold m-0 text-dark">MBKM UKSW</h5>
            <span class="text-muted small">Login User</span>
          </div>
        </div>
        <form method="post" action="" id="formLogin">
          <div class="mb-3">
            <label for="inputUsr" class="form-label small fw-semibold text-secondary">Username:</label>
            <input type="text" id="inputUsr" class="form-control" placeholder="Masukkan username" required>
          </div>
          <div class="mb-4">
            <label for="inputPwd" class="form-label small fw-semibold text-secondary">Password:</label>
            <input type="password" id="inputPwd" class="form-control" placeholder="Masukkan password" required>
            <i class="bi bi-eye-slash" id="togglePwd"></i>
          </div>
          <div class="d-flex justify-content-md-end">
            <button type="submit" class="btn btn-sm btn-primary">Login<i class="bi bi-box-arrow-in-right ms-2"></i></button>
          </div>
        </form>
      </div>
    </main>
    
    <script>
      $(document).ready(function() {
        sessionStorage.clear();
        if($('#errmsg').html() == '') {
          $('#errmsg').css('display','none');
        }
      });
  
      $("#togglePwd").on("click", function() {
        const pwd = $(this).siblings('input');
        if(pwd.attr('type') === 'password') {
          pwd.attr('type','text');
          $(this).prop('class','bi bi-eye');
        } else {
          pwd.attr('type','password');
          $(this).prop('class','bi bi-eye-slash');
        }
      });
    </script>
  </body>
</html>
